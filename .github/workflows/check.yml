name: checks
on: [push, pull_request]
jobs:
  local-workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[collection]'
      - run: python src/main.py validate-skills
      - run: python scripts/validate_release.py --out output/ci-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          path: output/ci-validation.json
